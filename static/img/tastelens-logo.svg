<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32323;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="forkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer lens ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#lensGrad)" stroke-width="12"/>

  <!-- Inner lens -->
  <circle cx="100" cy="100" r="65" fill="url(#lensGrad)"/>

  <!-- Lens reflection -->
  <ellipse cx="75" cy="75" rx="20" ry="15" fill="rgba(255,255,255,0.3)" transform="rotate(-30 75 75)"/>

  <!-- Fork icon in center -->
  <g transform="translate(100,100) scale(0.8)">
    <!-- Fork handle -->
    <rect x="-8" y="10" width="16" height="50" rx="4" fill="url(#forkGrad)"/>
    <!-- Fork tines -->
    <rect x="-25" y="-45" width="6" height="45" rx="3" fill="url(#forkGrad)"/>
    <rect x="-8" y="-50" width="6" height="50" rx="3" fill="url(#forkGrad)"/>
    <rect x="5" y="-45" width="6" height="45" rx="3" fill="url(#forkGrad)"/>
    <rect x="18" y="-45" width="6" height="45" rx="3" fill="url(#forkGrad)"/>
    <!-- Fork base connecting tines -->
    <rect x="-25" y="-5" width="49" height="15" rx="4" fill="url(#forkGrad)"/>
  </g>

  <!-- Camera viewfinder corners -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M 170 50 L 170 30 L 150 30" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M 30 150 L 30 170 L 50 170" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M 170 150 L 170 170 L 150 170" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
</svg>
